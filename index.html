<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Creator — offline QR code generator</title>
<style>
  :root {
    --bg: #0c0d12;
    --panel: #15171e;
    --panel-2: #1b1e27;
    --border: #292d39;
    --text: #f5f6f8;
    --muted: #9ba3b4;
    --accent: #7c6cf2;
    --accent-2: #6858df;
    --danger: #ff6b6b;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7fb;
      --panel: #ffffff;
      --panel-2: #f7f7fa;
      --border: #e3e4ea;
      --text: #17181d;
      --muted: #6f7480;
      --accent: #6557d9;
      --accent-2: #5548c6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 56px 20px 40px; }
  header { max-width: 650px; margin: 0 auto 36px; text-align: center; }
  header h1 { font-size: clamp(32px, 5vw, 46px); margin: 0 0 8px; letter-spacing: -0.045em; line-height: 1.08; }
  header p { margin: 0; color: var(--muted); font-size: 16px; }
  .free-badge {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0 0 16px; padding: 6px 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
    border-radius: 999px; background: color-mix(in srgb, var(--accent) 9%, var(--panel));
    color: var(--text); font-size: 12px; font-weight: 700;
  }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.08);
  }
  label { display: block; font-size: 13px; font-weight: 650; margin: 0 0 8px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 190px; font-family: inherit; line-height: 1.55; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .field { margin-bottom: 20px; }
  .row { display: flex; gap: 14px; }
  .row > .field { flex: 1; margin-bottom: 0; }
  .colors { display: flex; gap: 16px; align-items: flex-end; }
  .colorwrap { display: flex; align-items: center; gap: 8px; }
  input[type=color] {
    width: 42px; height: 38px; padding: 2px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--panel-2); cursor: pointer;
  }
  .preview-panel { position: sticky; top: 24px; }
  .qr-stage {
    background: #ffffff; border-radius: 12px; padding: 24px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); min-height: 310px;
  }
  .qr-stage svg { width: 100%; height: auto; max-width: 300px; display: block; }
  .meta { font-size: 12px; color: var(--muted); text-align: center; margin: 12px 0 18px; min-height: 16px; }
  .downloads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .downloads button {
    padding: 11px 0; font-size: 13px; font-weight: 700;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
  }
  .downloads button:hover { border-color: var(--accent); }
  .downloads #dl-png { grid-column: 1 / -1; background: var(--accent); color: #fff; border-color: var(--accent); }
  .downloads #dl-png:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .downloads button:disabled { opacity: 0.4; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; }
  .err:empty { display: none; }
  details { border-top: 1px solid var(--border); padding-top: 18px; }
  summary { color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 650; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; float: right; font-size: 18px; line-height: 1; }
  details[open] summary::after { content: "−"; }
  .customize { padding-top: 20px; }
  .customize .row + .row { margin-top: 18px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
  footer strong { color: var(--text); }
  @media (max-width: 560px) {
    .wrap { padding: 32px 14px 28px; }
    header { margin-bottom: 24px; }
    .panel { padding: 18px; }
    .qr-stage { min-height: 260px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="free-badge" aria-label="Free forever">✓ Free forever — no sign-up, limits, or fees</div>
    <h1>QR Creator</h1>
    <p>Paste anything. Get a QR code instantly.</p>
  </header>

  <div class="grid">
    <!-- Controls -->
    <div class="panel">
      <div class="field">
        <label for="input">Link or text
          <span class="hint" id="modeHint"></span>
        </label>
        <textarea id="input" placeholder="Paste a URL, message, contact details…" spellcheck="false">https://example.com</textarea>
      </div>

      <details>
        <summary>Customize</summary>
        <div class="customize">
          <div class="row">
            <div class="field">
              <label>Colors</label>
              <div class="colors">
                <div class="colorwrap"><input type="color" id="fg" value="#000000" aria-label="QR color"><span class="hint">QR</span></div>
                <div class="colorwrap"><input type="color" id="bg" value="#ffffff" aria-label="Background color"><span class="hint">Background</span></div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="quiet">Margin</label>
              <input type="number" id="quiet" value="2" min="0" max="16" step="1">
            </div>
            <div class="field">
              <label for="pngsize">PNG resolution</label>
              <input type="number" id="pngsize" value="1024" min="64" max="4096" step="64">
            </div>
          </div>
        </div>
      </details>
      <div class="err" id="error"></div>
    </div>

    <!-- Preview -->
    <div class="panel preview-panel">
      <div class="qr-stage" id="stage"></div>
      <div class="meta" id="meta"></div>
      <div class="downloads">
        <button id="dl-png" disabled>Download PNG</button>
        <button id="dl-svg" disabled>SVG</button>
        <button id="dl-pdf" disabled>PDF</button>
      </div>
    </div>
  </div>

  <footer>
    <strong>Private by design.</strong> Everything stays in your browser. Free forever.
  </footer>
</div>

<script>
"use strict";
/* ============================================================================
   QR CODE ENCODER (vanilla JS, versions 1-40, byte/numeric/alphanumeric modes)
   Based on the algorithm from Project Nayuki's QR Code generator (MIT-style).
   Self-contained: no dependencies, no network.
   ========================================================================== */
const QR = (function () {

  const ECC_CODEWORDS_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
  ];
  const NUM_ERROR_CORRECTION_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]
  ];
  // Error correction ordinal + format bits: L,M,Q,H
  const ECC = { L:{o:0,fb:1}, M:{o:1,fb:0}, Q:{o:2,fb:3}, H:{o:3,fb:2} };
  const ALNUM = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";

  function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

  function rsMultiply(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }
  function rsDivisor(degree) {
    const result = [];
    for (let i = 0; i < degree - 1; i++) result.push(0);
    result.push(1);
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = rsMultiply(result[j], root);
        if (j + 1 < result.length) result[j] ^= result[j + 1];
      }
      root = rsMultiply(root, 0x02);
    }
    return result;
  }
  function rsRemainder(data, divisor) {
    const result = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      for (let i = 0; i < divisor.length; i++) result[i] ^= rsMultiply(divisor[i], factor);
    }
    return result;
  }

  function numRawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const na = Math.floor(ver / 7) + 2;
      result -= (25 * na - 10) * na - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }
  function numDataCodewords(ver, ecl) {
    return Math.floor(numRawDataModules(ver) / 8)
      - ECC_CODEWORDS_PER_BLOCK[ecl.o][ver] * NUM_ERROR_CORRECTION_BLOCKS[ecl.o][ver];
  }

  function detectMode(text) {
    if (/^[0-9]*$/.test(text)) return "numeric";
    for (const ch of text) if (ALNUM.indexOf(ch) < 0) return "byte";
    return "alphanumeric";
  }
  function charCountBits(mode, ver) {
    const idx = ver <= 9 ? 0 : ver <= 26 ? 1 : 2;
    return { numeric: [10,12,14], alphanumeric: [9,11,13], byte: [8,16,16] }[mode][idx];
  }
  function segBitLength(mode, numChars) {
    if (mode === "byte") return numChars * 8;
    if (mode === "numeric") {
      const r = numChars % 3;
      return Math.floor(numChars / 3) * 10 + (r === 1 ? 4 : r === 2 ? 7 : 0);
    }
    return Math.floor(numChars / 2) * 11 + (numChars % 2) * 6;
  }

  function appendBits(val, len, bb) {
    for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1);
  }

  function encode(text, eccName) {
    let ecl = ECC[eccName];
    const mode = detectMode(text);
    let bytes = null, numChars;
    if (mode === "byte") { bytes = Array.from(new TextEncoder().encode(text)); numChars = bytes.length; }
    else numChars = text.length;

    const segBits = segBitLength(mode, numChars);

    // pick smallest version that fits at chosen level
    let version = 0;
    for (let v = 1; v <= 40; v++) {
      const used = 4 + charCountBits(mode, v) + segBits;
      if (used <= numDataCodewords(v, ecl) * 8) { version = v; break; }
    }
    if (version === 0) throw new Error("Content is too long to fit in a QR code. Shorten it or lower the error-correction level.");

    // boost ecc level if it fits for free at the same version
    for (const name of ["M","Q","H"]) {
      const cand = ECC[name];
      if (cand.o > ecl.o) {
        const used = 4 + charCountBits(mode, version) + segBits;
        if (used <= numDataCodewords(version, cand) * 8) ecl = cand;
      }
    }

    // build bit stream
    const bb = [];
    const modeIndicator = { numeric: 1, alphanumeric: 2, byte: 4 }[mode];
    appendBits(modeIndicator, 4, bb);
    appendBits(numChars, charCountBits(mode, version), bb);

    if (mode === "byte") {
      for (const b of bytes) appendBits(b, 8, bb);
    } else if (mode === "numeric") {
      for (let i = 0; i < text.length; ) {
        const n = Math.min(3, text.length - i);
        appendBits(parseInt(text.substr(i, n), 10), n * 3 + 1, bb);
        i += n;
      }
    } else {
      for (let i = 0; i < text.length; ) {
        if (text.length - i >= 2) {
          appendBits(ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i+1]), 11, bb);
          i += 2;
        } else {
          appendBits(ALNUM.indexOf(text[i]), 6, bb);
          i += 1;
        }
      }
    }

    const capacityBits = numDataCodewords(version, ecl) * 8;
    appendBits(0, Math.min(4, capacityBits - bb.length), bb);          // terminator
    appendBits(0, (8 - bb.length % 8) % 8, bb);                        // byte align
    for (let pad = 0xEC; bb.length < capacityBits; pad ^= 0xEC ^ 0x11) // pad bytes
      appendBits(pad, 8, bb);

    const dataCodewords = new Array(bb.length >>> 3).fill(0);
    for (let i = 0; i < bb.length; i++) dataCodewords[i >>> 3] |= bb[i] << (7 - (i & 7));

    return buildMatrix(version, ecl, dataCodewords);
  }

  function buildMatrix(version, ecl, dataCodewords) {
    const size = version * 4 + 17;
    const modules = Array.from({length: size}, () => new Array(size).fill(false));
    const isFunc = Array.from({length: size}, () => new Array(size).fill(false));

    function setFunc(x, y, dark) { modules[y][x] = dark; isFunc[y][x] = true; }

    function alignPositions() {
      if (version === 1) return [];
      const na = Math.floor(version / 7) + 2;
      const step = version === 32 ? 26 : Math.ceil((version * 4 + 4) / (na * 2 - 2)) * 2;
      const result = [6];
      for (let pos = size - 7; result.length < na; pos -= step) result.splice(1, 0, pos);
      return result;
    }
    function drawFinder(x, y) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFunc(xx, yy, dist !== 2 && dist !== 4);
      }
    }
    function drawAlign(x, y) {
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setFunc(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    function drawFormat(mask) {
      const data = (ecl.fb << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = ((data << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFunc(8, i, getBit(bits, i));
      setFunc(8, 7, getBit(bits, 6));
      setFunc(8, 8, getBit(bits, 7));
      setFunc(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFunc(14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setFunc(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFunc(8, size - 15 + i, getBit(bits, i));
      setFunc(8, size - 8, true);
    }
    function drawVersion() {
      if (version < 7) return;
      let rem = version;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const bits = (version << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const bit = getBit(bits, i);
        const a = size - 11 + (i % 3), b = Math.floor(i / 3);
        setFunc(a, b, bit); setFunc(b, a, bit);
      }
    }

    // function patterns
    for (let i = 0; i < size; i++) { setFunc(6, i, i % 2 === 0); setFunc(i, 6, i % 2 === 0); }
    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);
    const ap = alignPositions();
    for (let i = 0; i < ap.length; i++) for (let j = 0; j < ap.length; j++) {
      if (!((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)))
        drawAlign(ap[i], ap[j]);
    }
    drawFormat(0);
    drawVersion();

    // ECC + interleave
    const allCodewords = addEccAndInterleave(version, ecl, dataCodewords);

    // place data
    (function drawCodewords(data) {
      let i = 0;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (let vert = 0; vert < size; vert++) {
          for (let j = 0; j < 2; j++) {
            const x = right - j;
            const upward = ((right + 1) & 2) === 0;
            const y = upward ? size - 1 - vert : vert;
            if (!isFunc[y][x] && i < data.length * 8) {
              modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
              i++;
            }
          }
        }
      }
    })(allCodewords);

    function applyMask(mask) {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (isFunc[y][x]) continue;
        let invert;
        switch (mask) {
          case 0: invert = (x + y) % 2 === 0; break;
          case 1: invert = y % 2 === 0; break;
          case 2: invert = x % 3 === 0; break;
          case 3: invert = (x + y) % 3 === 0; break;
          case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: invert = (x * y) % 2 + (x * y) % 3 === 0; break;
          case 6: invert = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
          case 7: invert = ((x + y) % 2 + (x * y) % 3) % 2 === 0; break;
        }
        if (invert) modules[y][x] = !modules[y][x];
      }
    }

    function penalty() {
      let result = 0;
      const N1 = 3, N2 = 3, N3 = 40, N4 = 10;
      // rows & columns
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < size; i++) {
          let runColor = false, runLen = 0;
          const hist = [0,0,0,0,0,0,0];
          const get = (k) => pass === 0 ? modules[i][k] : modules[k][i];
          const addHist = (len) => {
            if (hist[0] === 0) len += size;
            hist.pop(); hist.unshift(len);
          };
          const countPatterns = () => {
            const n = hist[1];
            const core = n > 0 && hist[2] === n && hist[3] === n * 3 && hist[4] === n && hist[5] === n;
            return (core && hist[0] >= n * 4 && hist[6] >= n ? 1 : 0)
                 + (core && hist[6] >= n * 4 && hist[0] >= n ? 1 : 0);
          };
          for (let k = 0; k < size; k++) {
            if (get(k) === runColor) {
              runLen++;
              if (runLen === 5) result += N1; else if (runLen > 5) result++;
            } else {
              addHist(runLen);
              if (!runColor) result += countPatterns() * N3;
              runColor = get(k); runLen = 1;
            }
          }
          // terminate
          if (runColor) { addHist(runLen); runLen = 0; }
          runLen += size;
          addHist(runLen);
          result += countPatterns() * N3;
        }
      }
      // 2x2 blocks
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = modules[y][x];
        if (c === modules[y][x+1] && c === modules[y+1][x] && c === modules[y+1][x+1]) result += N2;
      }
      // balance
      let dark = 0;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (modules[y][x]) dark++;
      const total = size * size;
      const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
      result += k * N4;
      return result;
    }

    // choose best mask
    let bestMask = 0, minPenalty = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty();
      if (p < minPenalty) { minPenalty = p; bestMask = m; }
      applyMask(m); // undo
    }
    applyMask(bestMask); drawFormat(bestMask);

    return { size, modules, version, ecl };
  }

  function addEccAndInterleave(version, ecl, data) {
    const numBlocks = NUM_ERROR_CORRECTION_BLOCKS[ecl.o][version];
    const blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl.o][version];
    const rawCodewords = Math.floor(numRawDataModules(version) / 8);
    const numShort = numBlocks - rawCodewords % numBlocks;
    const shortLen = Math.floor(rawCodewords / numBlocks);
    const blocks = [];
    const div = rsDivisor(blockEccLen);
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dat = data.slice(k, k + shortLen - blockEccLen + (i < numShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const result = [];
    for (let i = 0; i < blocks[0].length; i++) {
      for (let j = 0; j < blocks.length; j++) {
        if (i !== shortLen - blockEccLen || j >= numShort) result.push(blocks[j][i]);
      }
    }
    return result;
  }

  return { encode };
})();

/* ============================================================================
   RENDERING & EXPORT
   ========================================================================== */

function buildSVG(qr, opts) {
  const { size, modules } = qr;
  const border = opts.quiet;
  const dim = size + border * 2;
  let path = "";
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (modules[y][x]) path += `M${x + border} ${y + border}h1v1h-1z`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges">`
    + `<rect width="${dim}" height="${dim}" fill="${opts.bg}"/>`
    + `<path d="${path}" fill="${opts.fg}"/></svg>`;
}

function buildPNG(qr, opts, targetPx, cb) {
  const { size, modules } = qr;
  const border = opts.quiet;
  const dim = size + border * 2;
  const scale = Math.max(1, Math.round(targetPx / dim));
  const px = dim * scale;
  const canvas = document.createElement("canvas");
  canvas.width = px; canvas.height = px;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = opts.bg; ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = opts.fg;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (modules[y][x]) ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
  }
  canvas.toBlob(cb, "image/png");
}

// Minimal self-contained vector PDF writer (crisp at any zoom).
function buildPDF(qr, opts) {
  const { size, modules } = qr;
  const border = opts.quiet;
  const dim = size + border * 2;
  const ms = 8; // points per module
  const W = dim * ms;

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  const bg = hexToRgb(opts.bg), fg = hexToRgb(opts.fg);
  const f = (v) => v.toFixed(3).replace(/\.?0+$/, "") || "0";

  let content = `${f(bg[0])} ${f(bg[1])} ${f(bg[2])} rg\n0 0 ${W} ${W} re f\n`;
  content += `${f(fg[0])} ${f(fg[1])} ${f(fg[2])} rg\n`;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (modules[y][x]) {
      const px = (border + x) * ms;
      const py = (dim - 1 - (border + y)) * ms; // PDF origin bottom-left
      content += `${px} ${py} ${ms} ${ms} re\n`;
    }
  }
  content += "f\n";

  const objs = [
    "<</Type/Catalog/Pages 2 0 R>>",
    "<</Type/Pages/Kids[3 0 R]/Count 1>>",
    `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${W}]/Contents 4 0 R/Resources<<>>>>`,
    `<</Length ${content.length}>>\nstream\n${content}endstream`
  ];

  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((o, i) => {
    offsets.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${o}\nendobj\n`;
  });
  const xrefStart = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  offsets.forEach((off) => { pdf += String(off).padStart(10, "0") + " 00000 n \n"; });
  pdf += `trailer\n<</Size ${objs.length + 1}/Root 1 0 R>>\nstartxref\n${xrefStart}\n%%EOF`;

  return new Blob([pdf], { type: "application/pdf" });
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============================================================================
   UI WIRING
   ========================================================================== */

const el = (id) => document.getElementById(id);
const input = el("input"), stage = el("stage"), meta = el("meta"), errBox = el("error");
const modeHint = el("modeHint");
let currentQR = null;

function fileBase() {
  const t = input.value.trim();
  const slug = t.replace(/^https?:\/\//, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  return slug || "qrcode";
}

function opts() {
  return {
    fg: el("fg").value,
    bg: el("bg").value,
    quiet: Math.max(0, Math.min(16, parseInt(el("quiet").value, 10) || 0))
  };
}

function render() {
  const text = input.value;
  errBox.textContent = "";
  const setDisabled = (d) => ["dl-svg","dl-png","dl-pdf"].forEach(id => el(id).disabled = d);

  if (!text) {
    stage.innerHTML = ""; meta.textContent = ""; modeHint.textContent = "";
    currentQR = null; setDisabled(true);
    return;
  }
  try {
    currentQR = QR.encode(text, "M");
    stage.innerHTML = buildSVG(currentQR, opts());
    meta.textContent = `${currentQR.size}×${currentQR.size} QR code`;
    modeHint.textContent = `· ${text.length} chars`;
    setDisabled(false);
  } catch (e) {
    stage.innerHTML = ""; meta.textContent = "";
    currentQR = null; setDisabled(true);
    errBox.textContent = e.message;
  }
}

// events
input.addEventListener("input", render);
["fg","bg","quiet"].forEach(id => el(id).addEventListener("input", render));

el("dl-svg").addEventListener("click", () => {
  if (!currentQR) return;
  download(new Blob([buildSVG(currentQR, opts())], { type: "image/svg+xml" }), fileBase() + ".svg");
});
el("dl-png").addEventListener("click", () => {
  if (!currentQR) return;
  const target = Math.max(64, Math.min(4096, parseInt(el("pngsize").value, 10) || 1024));
  buildPNG(currentQR, opts(), target, (blob) => download(blob, fileBase() + ".png"));
});
el("dl-pdf").addEventListener("click", () => {
  if (!currentQR) return;
  download(buildPDF(currentQR, opts()), fileBase() + ".pdf");
});

render();
</script>
</body>
</html>
